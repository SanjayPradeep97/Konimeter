[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sem-particle-analysis"
version = "0.2.0"
description = "AI-powered particle segmentation and analysis for SEM/TEM images using Meta's SAM"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sanjay Pradeep"}
]
keywords = ["image-processing", "segmentation", "microscopy", "SEM", "TEM", "SAM", "particle-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "easyocr>=1.7.0",
    "tifffile>=2023.1.0",
    "tqdm>=4.65.0",
    # 6.0 moved css, theme and head from Blocks() to launch(), which both apps use.
    "gradio>=6.0",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
]

[project.scripts]
sem-analyze = "sem_particle_analysis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipywidgets>=7.6.0",
]

[project.urls]
Homepage = "https://github.com/SanjayPradeep97/SAM-SEM-Segmentation"
Repository = "https://github.com/SanjayPradeep97/SAM-SEM-Segmentation"

[tool.setuptools.packages.find]
where = ["sem_particle_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
