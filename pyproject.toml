[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "konimeter"
version = "0.3.0"
description = "Segment, count and measure particles in SEM and TEM micrographs, built on Segment Anything"
readme = "README.md"
# Gradio 6 needs 3.10.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sanjay Pradeep"}
]
keywords = ["image-processing", "segmentation", "microscopy", "SEM", "TEM", "SAM", "particle-analysis",
            "exposure-science", "nanomaterials", "microplastics", "particulate-matter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    # Headless: nothing here opens an OpenCV window, and EasyOCR requires the
    # headless build, so asking for opencv-python as well installs two copies of
    # cv2 over each other.
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "easyocr>=1.7.0",
    "tifffile>=2023.1.0",
    "tqdm>=4.65.0",
    # 6.0 moved css, theme and head from Blocks() to launch(), which the app uses.
    "gradio>=6.0",
    # Pinned to a commit: the repository publishes no releases.
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git@dca509fe793f601edb92606367a655c15ac00fdf",
]

[project.scripts]
konimeter = "sem_analysis_app.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/SanjayPradeep97/Konimeter"
Repository = "https://github.com/SanjayPradeep97/Konimeter"
Issues = "https://github.com/SanjayPradeep97/Konimeter/issues"

[tool.setuptools.packages.find]
include = ["sem_particle_analysis*", "sem_analysis_app*"]

[tool.setuptools.package-data]
sem_analysis_app = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
