name: tests

on:
  push:
    branches: [publication]
  pull_request:
    branches: [publication]
  workflow_dispatch:

jobs:
  demo:
    # The demo's tests that need no model weights, on every platform a
    # reviewer might use: the shipped images, the first guess, the mask rule,
    # the SAM download and every button of the page.
    name: demo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install what the page needs
        run: pip install "gradio>=6" numpy scipy scikit-image pillow pytest
      - name: Run the tests
        run: pytest -m "not slow"

  launcher:
    # run_demo.bat and reproduce.bat find conda and the cnt-vfm environment
    # through scripts/activate_env.bat; this runs it as a double-click would.
    name: windows launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: cnt-vfm
          python-version: "3.11"
          auto-activate-base: false
      - name: activate_env.bat activates the environment
        shell: cmd
        run: |
          set "CNT_ENV="
          call scripts\activate_env.bat || exit /b 1
          python -c "import os, sys; p = os.environ.get('CONDA_PREFIX', ''); print(p); sys.exit(not p.lower().endswith('cnt-vfm'))"
