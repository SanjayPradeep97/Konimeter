# Classification pipeline + demo environment WITHOUT CUDA (`cnt-vfm`).
#
# Use this on macOS, on Linux/Windows machines without an NVIDIA GPU, or
# whenever environment.yml fails to resolve the CUDA 12.8 torch build.  Same
# package set as environment.yml.  PyTorch, torchvision and XGBoost come from
# conda-forge rather than PyPI (CPU on Windows/Linux, CPU + MPS on Apple
# silicon), so that they share conda's single OpenMP runtime.  From PyPI on
# macOS, XGBoost cannot load at all without Homebrew's libomp, and with it the
# two OpenMP runtimes crash the Luo baseline as soon as both are in use.
#
#     conda env create -f environment-cpu.yml
#     conda activate cnt-vfm
#     python classification/check_env.py
#
# What runs on CPU: the demo (a few seconds per click), the statistics, the
# tables, the manuscript check, the tests, the figures.  Feature extraction for
# the full benchmark (reproduce.bat / reproduce.sh stages 1-2) takes hours
# rather than minutes, and stage 3 is impractical without a GPU.
name: cnt-vfm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.6
  - torchvision
  - xgboost>=2.1
  - pip:
      - timm>=1.0.15
      - huggingface_hub
      - scikit-learn>=1.4
      - scipy
      - numpy
      - pandas
      - pillow
      - matplotlib
      - seaborn
      - opencv-python
      - scikit-image
      - tqdm
      - ultralytics>=8.3
      - gradio>=6   # css, theme and head are launch() arguments from 6.0
      - pytest>=7
      - tifffile
      - git+https://github.com/facebookresearch/segment-anything.git
